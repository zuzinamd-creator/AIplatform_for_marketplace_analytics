# Staging / preview frontend (Ledger P0) — DOES NOT replace production root.
# URL: https://321997.fornex.cloud:8443/
# Prod remains: https://321997.fornex.cloud/  → /var/www/marketplace-analytics

upstream marketplace_api_staging {
    server 127.0.0.1:8000;
    keepalive 4;
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name 321997.fornex.cloud 31.172.73.127;

    ssl_certificate /etc/letsencrypt/live/321997.fornex.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/321997.fornex.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    root /var/www/marketplace-analytics-staging;
    index index.html;

    add_header X-Marketplace-Environment "staging-preview" always;

    location = /health {
        proxy_pass http://marketplace_api_staging;
        include /etc/nginx/snippets/marketplace-proxy.conf;
    }

    location = /health/ready {
        proxy_pass http://marketplace_api_staging;
        include /etc/nginx/snippets/marketplace-proxy.conf;
    }

    location /api/ {
        proxy_pass http://marketplace_api_staging;
        include /etc/nginx/snippets/marketplace-proxy.conf;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Marketplace-Environment "staging-preview" always;
        include /etc/nginx/snippets/marketplace-security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Marketplace-Environment "staging-preview" always;
        include /etc/nginx/snippets/marketplace-security-headers.conf;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Marketplace-Environment "staging-preview" always;
        include /etc/nginx/snippets/marketplace-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
