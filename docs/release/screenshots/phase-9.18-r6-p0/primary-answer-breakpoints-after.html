<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Primary Answer breakpoint fixture</title>
  <style>
    :root {
      --ledger-profit: #0f7b5a;
      --ledger-profit-soft: #e6f5ef;
      --ledger-risk: #c81e1e;
      --ledger-risk-soft: #fdecec;
      --ledger-neutral-900: #111827;
      --ledger-neutral-700: #3f4b5a;
      --ledger-neutral-500: #6b7280;
      --ledger-canvas: #f7f8fa;
      --ledger-panel: #ffffff;
      --ledger-hairline: #e6e8ec;
      --ledger-action: #0b6bcb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--ledger-canvas); color: var(--ledger-neutral-900); }
    .shell { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
    .chrome { margin-bottom: 12px; }
    .h1-compact { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--ledger-hairline); margin-bottom: 12px; }
    .tab { padding: 8px 12px; font-size: 13px; color: var(--ledger-neutral-500); }
    .tab.active { color: var(--ledger-action); border-bottom: 2px solid var(--ledger-action); font-weight: 600; }
    .period {
      background: var(--ledger-panel); border: 1px solid var(--ledger-hairline); border-radius: 10px;
      padding: 12px; margin-bottom: 12px; font-size: 13px; color: var(--ledger-neutral-700);
    }
    .card {
      background: var(--ledger-panel); border: 1px solid var(--ledger-hairline); border-radius: 12px;
      padding: 20px 24px; box-shadow: 0 1px 2px rgba(17,24,39,.04), 0 8px 24px rgba(17,24,39,.06);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; gap: 16px; } }
    .label { font-size: 13px; font-weight: 500; color: var(--ledger-neutral-500); }
    .metric { margin-top: 6px; font-size: clamp(28px, 4vw, 36px); font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .metric.profit { color: var(--ledger-profit); }
    .trust {
      margin-top: 14px; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px;
      border: 1px solid rgba(15,123,90,.3); background: var(--ledger-profit-soft);
      border-radius: 8px; padding: 8px 12px; font-size: 12px;
    }
    .badge { background: rgba(15,123,90,.12); color: var(--ledger-profit); font-weight: 600; border-radius: 999px; padding: 2px 8px; }
    .hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: #111827; color: #fff; font: 12px/1.4 ui-monospace, monospace;
      padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 12px;
    }
    .body-pad { padding-top: 36px; }
    .ruler { outline: 1px dashed rgba(11,107,203,.35); }
  </style>
</head>
<body class="body-pad">
  <div class="hud" id="hud">viewport: — · PrimaryAnswer top: —px</div>
  <div class="shell">
    <div class="chrome">
      <h1 class="h1-compact">Аналитика</h1>
      <nav class="tabs" aria-label="Вкладки">
        <span class="tab active">Обзор</span>
        <span class="tab">Сравнение периодов</span>
        <span class="tab">Экономика SKU</span>
      </nav>
      <div class="period">Период · 2026-01-01 → 2026-07-20</div>
    </div>
    <div class="card ruler" data-testid="primary-answer" id="primary-answer">
      <div class="grid">
        <div>
          <div class="label">Выручка</div>
          <div class="metric">1 245 000 ₽</div>
        </div>
        <div>
          <div class="label">Чистая прибыль</div>
          <div class="metric profit">186 400 ₽</div>
        </div>
      </div>
      <div class="trust" data-testid="trust-badge" role="status">
        <span class="badge">Доверие: полное</span>
        <span>92%</span>
        <span>184 / 200 SKU</span>
      </div>
    </div>
  </div>
  <script>
    function tick() {
      const el = document.getElementById('primary-answer');
      const top = Math.round(el.getBoundingClientRect().top + window.scrollY);
      document.getElementById('hud').textContent =
        'viewport: ' + window.innerWidth + '×' + window.innerHeight +
        ' · PrimaryAnswer top: ' + top + 'px' +
        ' · mode: AFTER (Ledger P0 chrome diet)';
    }
    tick();
    window.addEventListener('resize', tick);
  </script>
</body>
</html>
